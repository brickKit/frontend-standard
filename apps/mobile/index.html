<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      const coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)')
  || CSS.supports('top: constant(a)'))
      document.write(
        `<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0${
  coverSupport ? ', viewport-fit=cover' : ''}" />`)
    </script>
    <title>BrickEnterprise</title>
    <!--
      真机踩过的坑：uni-app 的 Vite 插件（@uni-helper/plugin-uni）在 dev
      模式下会把 index.html 里所有 <script src> 都当模块请求预处理一遍，
      Vite 自己的规则又明确拒绝"/public 下的文件被当模块 import"（报
      500，"should not be imported from source code"）——跟 apps/pc 的
      plain Vite 完全不会有这个问题，是这个插件特有的。生产构建不受影响
      （已验证：dist/build/h5 下独立 config.js 文件正常复制、正常被加载），
      但为了 dev 体验一致，这里改成内联 + 注释占位符，Docker entrypoint
      用 sed 替换这两行注释之间的内容，不再依赖一个独立的、走
      <script src> 引用的文件（见 Dockerfile 里对应的
      docker-entrypoint.sh）。
    -->
    <!-- BE_CONFIG_START -->
    <script>
      window.__BE_CONFIG__ = { gatewayBaseUrl: "", iamIssuerUrl: "http://localhost:8000", casdoorClientId: "" };
    </script>
    <!-- BE_CONFIG_END -->
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
