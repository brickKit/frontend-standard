server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 导读第 7 条：/healthz 不查依赖、不查上游，纯静态 200。
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # PC：Vue Router history 模式，任何未命中静态资源的路径回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 移动端 H5：uni-app 默认 hash 路由（/m/#/pages/...），真机验证过
    # 不需要额外的服务端 rewrite——这条 try_files 只是兜底直接访问
    # /m/ 本身（不带 hash）时也能拿到 index.html。
    location /m/ {
        alias /usr/share/nginx/html/m/;
        try_files $uri $uri/ /m/index.html;
    }
}
